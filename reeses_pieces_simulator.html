<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reese’s Pieces Sampling Simulator</title>
<style>
:root{
  --navy:#00274C; --maize:#FFCB05;
  --bg:#F3F5F8; --surface:#FFFFFF; --ink:#0E1A2B; --muted:#55627A; --line:#D3D9E3; --stripe:#F6F8FB;
  --sym:#00274C; --sym-new:#FFCB05; --sym-new-ink:#00274C; --hit:#D9480F; --curve:#2B7A3D; --shade:rgba(217,72,15,.16);
  --btn-bg:#00274C; --btn-ink:#FFFFFF; --btn2-bg:#E4E8EF; --btn2-ink:#00274C; --seg-on:#00274C; --seg-on-ink:#FFFFFF;
  --c-orange:#F2711C; --c-brown:#5B2E12; --c-yellow:#F7C41D; --candy-edge:rgba(0,0,0,.18);
  --focus:#2F6FDE;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06111F; --surface:#0C1D33; --ink:#E9EEF6; --muted:#9AA8BF; --line:#22385A; --stripe:#102540;
    --sym:#FFCB05; --sym-new:#FFFFFF; --sym-new-ink:#00274C; --hit:#FF8A4C; --curve:#6FD08C; --shade:rgba(255,138,76,.22);
    --btn-bg:#FFCB05; --btn-ink:#00274C; --btn2-bg:#1A3050; --btn2-ink:#E9EEF6; --seg-on:#FFCB05; --seg-on-ink:#00274C;
    --candy-edge:rgba(255,255,255,.25); --focus:#8AB4FF; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06111F; --surface:#0C1D33; --ink:#E9EEF6; --muted:#9AA8BF; --line:#22385A; --stripe:#102540;
  --sym:#FFCB05; --sym-new:#FFFFFF; --sym-new-ink:#00274C; --hit:#FF8A4C; --curve:#6FD08C; --shade:rgba(255,138,76,.22);
  --btn-bg:#FFCB05; --btn-ink:#00274C; --btn2-bg:#1A3050; --btn2-ink:#E9EEF6; --seg-on:#FFCB05; --seg-on-ink:#00274C;
  --candy-edge:rgba(255,255,255,.25); --focus:#8AB4FF; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;border-bottom:6px solid var(--maize)}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px}
header .wrap{padding-top:22px;padding-bottom:18px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 20px;justify-content:space-between}
h1{font:800 clamp(26px,4.2vw,40px)/1.1 system-ui,-apple-system,"Segoe UI",sans-serif;margin:0;letter-spacing:-.01em}
.pop{font-size:15px;color:#C9D4E5}
.pop b{color:var(--maize);font-weight:700}
main.wrap{padding-top:20px;padding-bottom:40px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:16px;padding:14px 18px}
.controls{margin-top:0;display:flex;flex-wrap:wrap;gap:16px 26px;align-items:flex-end}
.group{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-end}
.divider{width:1px;align-self:stretch;background:var(--line)}
.field label{display:block;font:700 13px/1.2 system-ui,sans-serif;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.field input[type=number]{width:110px;font:700 22px/1 system-ui,sans-serif;padding:8px 10px;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
button{font:700 18px/1 system-ui,sans-serif;border:0;border-radius:6px;padding:12px 18px;cursor:pointer}
.primary{background:var(--btn-bg);color:var(--btn-ink)}
.secondary{background:var(--btn2-bg);color:var(--btn2-ink)}
button:disabled{opacity:.5;cursor:not-allowed}
.chk{display:flex;align-items:center;gap:7px;font-size:15px;color:var(--muted);cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--navy)}
.msg{min-height:1.5em;margin:10px 2px 0;font-size:15px;color:var(--muted)}
.msg.err{color:var(--hit);font-weight:600}
h2{font:800 21px/1.2 system-ui,sans-serif;margin:0 0 8px}
.m{font-family:"Times New Roman",Times,serif;font-style:italic;font-size:1.18em}
.sub{font-size:.7em;vertical-align:-.3em;font-style:italic}

/* Most recent sample */
.recent{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:18px;align-items:start}
.candies{display:flex;flex-wrap:wrap;gap:5px;min-height:40px}
.candy{width:24px;height:24px;border-radius:50%;border:1px solid var(--candy-edge);box-shadow:inset -3px -3px 0 rgba(0,0,0,.12)}
.candy.o{background:var(--c-orange)} .candy.b{background:var(--c-brown)} .candy.y{background:var(--c-yellow)}
.tally{border-left:4px solid var(--c-orange);padding:4px 0 4px 14px}
.tally .big{font:800 40px/1 system-ui,sans-serif;color:var(--c-orange)}
.tally p{margin:4px 0}
.empty{color:var(--muted);margin:0}
.note{font-size:14px;color:var(--muted);margin:8px 0 0}

/* Dotplot */
.plothead{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;margin-bottom:6px}
.seg{display:inline-flex;border:2px solid var(--seg-on);border-radius:8px;overflow:hidden}
.seg button{border-radius:0;background:transparent;color:var(--ink);font-size:16px;padding:9px 14px}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--seg-on-ink)}
.plot svg{display:block;width:100%;height:auto}
.stats{display:flex;flex-wrap:wrap;gap:4px 26px;padding:4px 4px 0;font-size:16px;color:var(--muted)}
.stats b{color:var(--ink);font-weight:700}
.tools{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.counter{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-size:16px}
.counter select,.counter input[type=number]{font:700 17px system-ui,sans-serif;padding:6px 8px;border:2px solid var(--line);border-radius:6px;background:var(--bg);color:var(--ink)}
.counter input[type=number]{width:100px}
.countres{font-size:17px;margin-top:8px;min-height:1.5em}
.countres b{color:var(--hit)}

/* Theory + log */
.cols{display:grid;grid-template-columns:1.25fr 1fr;gap:16px}
.theory dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
.theory dt{font-weight:700;color:var(--muted);font-size:14px;text-transform:uppercase;letter-spacing:.04em}
.theory dd{margin:0;font-size:17px}
.ok{color:var(--curve);font-weight:700}
.bad{color:var(--hit);font-weight:700}
.logwrap{max-height:360px;overflow:auto;border:1px solid var(--line);border-radius:6px}
table{border-collapse:collapse;width:100%;font-size:15px}
th,td{padding:6px 10px;text-align:left;white-space:nowrap}
th{position:sticky;top:0;background:var(--surface);border-bottom:2px solid var(--line);font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
tbody tr:nth-child(even){background:var(--stripe)}
th .m,dt .m,dt .sub,.lc{text-transform:none}
.cols.solo{grid-template-columns:1fr}
td.v{font-weight:700}
.hidden{display:none}
@media (max-width:860px){ .cols,.recent{grid-template-columns:1fr} .divider{display:none} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <h1>Sampling Reese’s Pieces</h1>
    <div class="pop" id="popLine"></div>
  </div>
</header>
<main class="wrap">
  <section class="panel controls" aria-label="Simulation settings">
    <div class="group">
      <div class="field"><label for="p">Proportion orange (<span class="lc">p</span>)</label><input id="p" type="number" min="0" max="1" step="0.01" value="0.4"></div>
      <div class="field"><label for="n">Sample size (<span class="lc">n</span>)</label><input id="n" type="number" min="1" step="1" value="50" inputmode="numeric"></div>
      <div class="field"><label for="bag">Candies in bag</label><input id="bag" type="number" min="1" step="1" value="1000" inputmode="numeric"></div>
    </div>
    <div class="divider"></div>
    <div class="group"><button class="primary" id="one">Take 1 sample</button></div>
    <div class="divider"></div>
    <div class="group">
      <div class="field"><label for="k">Number of samples</label><input id="k" type="number" min="1" max="10000" step="1" value="100" inputmode="numeric"></div>
      <button class="primary" id="go">Take samples</button>
      <button class="secondary" id="reset">Clear</button>
    </div>
    <label class="chk" style="width:100%"><input type="checkbox" id="animate" checked> Add samples one at a time</label>
  </section>
  <p class="msg" id="msg" role="status"></p>

  <section class="panel" aria-live="polite">
    <h2>Most recent sample</h2>
    <div class="recent">
      <div><div class="candies" id="candies"></div><p class="note hidden" id="candyNote"></p></div>
      <div class="tally" id="tally"><p class="empty">Press <b>Take 1 sample</b> to scoop candies from the bag.</p></div>
    </div>
  </section>

  <section class="panel plot" aria-label="Dotplot of simulated samples">
    <div class="plothead">
      <h2 style="margin:0">Simulated sampling distribution</h2>
      <div class="seg" role="group" aria-label="Statistic to plot">
        <button id="statX" aria-pressed="true">Number orange (<span class="m">X</span>)</button>
        <button id="statP" aria-pressed="false">Proportion orange (<span class="m">p̂</span>)</button>
      </div>
    </div>
    <svg id="svg" viewBox="0 0 960 350" role="img"></svg>
    <div class="stats" id="stats"></div>
    <div class="tools">
      <div>
        <div class="counter">
          <label class="chk" style="color:var(--ink)"><input type="checkbox" id="countOn"> Count samples where <span id="countSym" class="m">X</span></label>
          <select id="countDir" aria-label="Direction"><option value="ge">≥</option><option value="le">≤</option></select>
          <input id="countVal" type="number" step="any" value="25" aria-label="Cutoff value">
        </div>
        <div class="countres" id="countRes"></div>
      </div>
      <label class="chk" style="color:var(--ink)"><input type="checkbox" id="theoryOn"> Show theory (Normal curve, formulas, conditions)</label>
    </div>
  </section>

  <div class="cols">
    <section class="panel theory hidden" id="theoryPanel"><h2>Theory</h2><div id="theoryBody"></div></section>
    <section class="panel" id="logPanel"><h2>Sample log</h2><div id="logBody"><p class="empty">Every sample is listed here in order.</p></div></section>
  </div>
</main>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const SVGNS="http://www.w3.org/2000/svg";
  const pIn=$("p"), nIn=$("n"), bagIn=$("bag"), kIn=$("k"), msg=$("msg");
  let samples=[];           // {x, colors}
  let params=null;          // {p,n,bag,orange}
  let stat="X";             // "X" or "P"
  let busy=false, timer=null;
  const reduceMotion=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  if(reduceMotion) $("animate").checked=false;

  function setMsg(t,err){ msg.textContent=t||""; msg.className="msg"+(err?" err":""); }
  const fmtNum=(v,d)=>{ const s=v.toFixed(d); return s.includes(".")?s.replace(/0+$/,"").replace(/\.$/,""):s; };

  function readParams(){
    const p=Number(pIn.value), n=Number(nIn.value), bag=Number(bagIn.value);
    if(!(p>=0&&p<=1)){ setMsg("Proportion orange must be between 0 and 1.",true); pIn.focus(); return null; }
    if(!Number.isInteger(bag)||bag<1||bag>1000000){ setMsg("Candies in bag must be a whole number from 1 to 1,000,000.",true); bagIn.focus(); return null; }
    if(!Number.isInteger(n)||n<1||n>bag){ setMsg(`Sample size must be a whole number from 1 to ${bag} (the number of candies in the bag).`,true); nIn.focus(); return null; }
    return {p,n,bag,orange:Math.round(p*bag)};
  }
  const sameParams=(a,b)=>a&&b&&a.p===b.p&&a.n===b.n&&a.bag===b.bag;

  // Scoop n candies from the bag without replacement
  function drawSample(P){
    let orangeLeft=P.orange, total=P.bag, x=0;
    const colors=[];
    for(let i=0;i<P.n;i++){
      if(Math.random()<orangeLeft/total){ orangeLeft--; x++; colors.push("o"); }
      else colors.push(Math.random()<0.5?"b":"y");
      total--;
    }
    return {x,colors};
  }

  function prepare(){
    const P=readParams(); if(!P) return null;
    if(params&&!sameParams(params,P)&&samples.length){ samples=[]; setMsg("Settings changed, so the old samples were cleared."); }
    else setMsg("");
    params=P; return P;
  }
  function setBusy(b){ busy=b; ["one","go"].forEach(id=>$(id).disabled=b); [pIn,nIn,bagIn,kIn].forEach(e=>e.disabled=b); }

  function add(k){
    const P=prepare(); if(!P) return;
    if(samples.length+k>20000){ setMsg("The dotplot holds up to 20,000 samples. Press Clear to start again.",true); return; }
    const animate=$("animate").checked&&k>1&&!reduceMotion;
    if(!animate){ for(let i=0;i<k;i++) samples.push(drawSample(P)); renderAll(); return; }
    setBusy(true); let done=0; const delay=Math.max(15,Math.min(250,5000/k));
    const per=k>400?Math.ceil(k/300):1;
    timer=setInterval(()=>{
      for(let j=0;j<per&&done<k;j++){ samples.push(drawSample(P)); done++; }
      renderAll();
      if(done>=k){ clearInterval(timer); timer=null; setBusy(false); }
    },delay);
  }

  $("one").addEventListener("click",()=>add(1));
  $("go").addEventListener("click",()=>{
    const k=Number(kIn.value);
    if(!Number.isInteger(k)||k<1||k>10000){ setMsg("Number of samples must be a whole number from 1 to 10,000.",true); kIn.focus(); return; }
    add(k);
  });
  $("reset").addEventListener("click",()=>{ if(timer){clearInterval(timer);timer=null;setBusy(false);} samples=[]; params=null; setMsg("Cleared."); renderAll(); });
  [pIn,nIn,bagIn].forEach(e=>e.addEventListener("change",()=>{
    const P=readParams();
    if(P&&samples.length&&!sameParams(params,P)){ samples=[]; params=P; setMsg("Settings changed, so the old samples were cleared."); }
    else if(P&&!samples.length){ params=null; setMsg(""); }
    renderAll();
  }));
  kIn.addEventListener("keydown",e=>{ if(e.key==="Enter") $("go").click(); });

  function setStat(s){
    if(s===stat) return;
    const P=params||readParams()||{n:50};
    const cv=Number($("countVal").value);
    if(Number.isFinite(cv)) $("countVal").value = s==="P" ? fmtNum(cv/P.n,4) : fmtNum(cv*P.n,2);
    $("countVal").step = s==="P" ? "0.01" : "1";
    stat=s;
    $("statX").setAttribute("aria-pressed",s==="X"); $("statP").setAttribute("aria-pressed",s==="P");
    $("countSym").textContent = s==="X" ? "X" : "p̂";
    renderAll();
  }
  $("statX").addEventListener("click",()=>setStat("X"));
  $("statP").addEventListener("click",()=>setStat("P"));
  ["countOn","countDir","countVal","theoryOn"].forEach(id=>{ $(id).addEventListener("input",renderAll); $(id).addEventListener("change",renderAll); });

  // ---------- Math helpers ----------
  function normCdf(z){ // Abramowitz & Stegun 7.1.26
    const t=1/(1+0.3275911*Math.abs(z)/Math.SQRT2);
    const y=1-(((((1.061405429*t-1.453152027)*t)+1.421413741)*t-0.284496736)*t+0.254829592)*t*Math.exp(-z*z/2);
    return z>=0?(1+y)/2:(1-y)/2;
  }
  function niceStep(raw){ const e=Math.pow(10,Math.floor(Math.log10(raw))); for(const m of [1,2,2.5,5,10]) if(m*e>=raw-1e-12) return m*e; return 10*e; }

  function theory(P){
    const mu=P.n*P.p, sd=Math.sqrt(P.n*P.p*(1-P.p));
    return stat==="X" ? {mu,sd,step:1} : {mu:P.p,sd:sd/P.n,step:1/P.n};
  }

  function axisFor(P,vals){
    const T=theory(P);
    const maxV= stat==="X"?P.n:1;
    let span=T.sd>0?9*T.sd:(stat==="X"?Math.max(2,P.n*0.2):0.2);
    const tick=niceStep(span/7);
    let lo=Math.max(0,Math.round((T.mu-span/2)/tick)*tick);
    let hi=Math.min(maxV,Math.round((T.mu+span/2)/tick)*tick);
    if(hi<=lo){ lo=Math.max(0,lo-tick); hi=Math.min(maxV,hi+tick); }
    if(vals.length){
      const mn=Math.min(...vals), mx=Math.max(...vals);
      if(mn<lo) lo=Math.max(0,Math.floor(mn/tick)*tick);
      if(mx>hi) hi=Math.min(maxV,Math.ceil(mx/tick)*tick);
    }
    if(hi<=lo) hi=lo+tick;
    return {lo,hi,tick};
  }

  // ---------- Dotplot ----------
  const W=960,ML=34,MR=34,MT=14,LABEL_BAND=28,BOTTOM=76,MIN_AREA=220,MAX_AREA=520,PW=W-ML-MR;
  function el(tag,attrs,parent){ const e=document.createElementNS(SVGNS,tag); for(const k in attrs) e.setAttribute(k,attrs[k]); if(parent) parent.appendChild(e); return e; }

  function countPred(){
    if(!$("countOn").checked) return null;
    const v=Number($("countVal").value); if(!Number.isFinite(v)||$("countVal").value==="") return null;
    const dir=$("countDir").value;
    return {v,dir,test:x=>dir==="ge"?x>=v-1e-9:x<=v+1e-9};
  }

  function drawPlot(P){
    const svg=$("svg");
    while(svg.firstChild) svg.removeChild(svg.firstChild);
    const css=getComputedStyle(document.documentElement), c=n=>css.getPropertyValue(n).trim();
    const ink=c("--ink"),muted=c("--muted"),symC=c("--sym"),newBg=c("--sym-new"),newInk=c("--sym-new-ink"),hit=c("--hit"),curveC=c("--curve"),shade=c("--shade");
    const font="system-ui, -apple-system, 'Segoe UI', sans-serif";
    const nShow=P?P.n:"n";
    const label= stat==="X" ? `Number of Orange Candies (sample size = ${nShow})` : `Proportion of Orange Candies (sample size = ${nShow})`;

    const vals=P?samples.map(s=>stat==="X"?s.x:s.x/P.n):[];
    const Pp=P||{p:0.4,n:50,bag:1000};
    const T=theory(Pp), ax=axisFor(Pp,vals);
    const sx=v=>ML+(v-ax.lo)/(ax.hi-ax.lo)*PW;
    const valStep=T.step, spacingPx=valStep/(ax.hi-ax.lo)*PW, MINCOL=12, BASE=22;
    let colW,keyOf,xOf,colVal;
    if(spacingPx>=MINCOL){ colW=Math.min(BASE,spacingPx); keyOf=v=>Math.round(v/valStep); xOf=k=>sx(k*valStep); colVal=valStep; }
    else { colW=MINCOL; keyOf=v=>Math.round((sx(v)-ML)/colW); xOf=k=>ML+k*colW; colVal=colW/PW*(ax.hi-ax.lo); }
    const pred=countPred(), last=samples[samples.length-1];
    const stacks=new Map();
    samples.forEach((s,i)=>{ const v=vals[i]; const k=keyOf(v); if(!stacks.has(k)) stacks.set(k,[]); stacks.get(k).push({v,isNew:s===last,hit:pred?pred.test(v):false}); });
    let maxStack=0; stacks.forEach(a=>{ if(a.length>maxStack) maxStack=a.length; });
    const showTheory=$("theoryOn").checked&&T.sd>0&&samples.length>0;
    const dens=v=>Math.exp(-0.5*((v-T.mu)/T.sd)**2)/(T.sd*Math.sqrt(2*Math.PI));
    const peak=showTheory?samples.length*dens(T.mu)*colVal:0;
    const tallest=Math.max(maxStack,peak*1.02);
    const area=Math.max(MIN_AREA,Math.min(MAX_AREA,tallest*colW*1.05+4));
    const H=MT+LABEL_BAND+area+BOTTOM, AXIS_Y=H-BOTTOM;
    svg.setAttribute("viewBox",`0 0 ${W} ${H}`);
    const rowH=Math.min(colW*1.05, tallest?area/tallest:colW);
    const size=Math.min(colW,rowH/1.05);

    // count region shading band
    if(pred){
      const xc=Math.min(Math.max(sx(pred.v),ML),W-MR);
      const x0=pred.dir==="ge"?xc:ML, x1=pred.dir==="ge"?W-MR:xc;
      if(x1>x0) el("rect",{x:x0,y:MT,width:x1-x0,height:AXIS_Y-MT,fill:shade},svg);
      el("line",{x1:xc,x2:xc,y1:MT,y2:AXIS_Y,stroke:hit,"stroke-width":2},svg);
    }

    // axis
    el("line",{x1:ML,x2:W-MR,y1:AXIS_Y,y2:AXIS_Y,stroke:ink,"stroke-width":1.5},svg);
    const nT=Math.round((ax.hi-ax.lo)/ax.tick);
    const dec=ax.tick>=1?0:Math.max(0,-Math.floor(Math.log10(ax.tick)+1e-9))+(ax.tick*Math.pow(10,-Math.floor(Math.log10(ax.tick)))%1?1:0);
    for(let i=0;i<=nT;i++){
      const t=ax.lo+i*ax.tick, x=sx(t);
      el("line",{x1:x,x2:x,y1:AXIS_Y,y2:AXIS_Y+8,stroke:ink,"stroke-width":1.5},svg);
      const tx=el("text",{x,y:AXIS_Y+27,"text-anchor":"middle","font-size":16,fill:ink,"font-family":font},svg); tx.textContent=t.toFixed(dec);
      if(i<nT){ const xm=sx(t+ax.tick/2); el("line",{x1:xm,x2:xm,y1:AXIS_Y,y2:AXIS_Y+4,stroke:ink,"stroke-width":1},svg); }
    }
    const lab=el("text",{x:ML+PW/2,y:H-18,"text-anchor":"middle","font-size":19,"font-weight":700,fill:ink,"font-family":font},svg); lab.textContent=label;
    if(!samples.length){ const e=el("text",{x:ML+PW/2,y:MT+LABEL_BAND+area/2,"text-anchor":"middle","font-size":17,fill:muted,"font-family":font},svg); e.textContent="No samples yet"; }

    // symbols
    const g=el("g",{},svg);
    stacks.forEach((arr,k)=>{
      const x=xOf(k);
      arr.forEach((o,i)=>{
        const yb=AXIS_Y-3-i*rowH;
        if(o.isNew) el("rect",{x:x-size/2,y:yb-rowH+0.5,width:size,height:Math.max(rowH-1,1),rx:Math.min(3,size/5),fill:newBg},g);
        const col=o.isNew?newInk:(o.hit?hit:symC);
        if(stat==="X"||size<7){
          el("circle",{cx:x,cy:yb-rowH/2,r:Math.max(Math.min(size,rowH)/2-1,1),fill:col},g);
        } else {
          const fs=size*0.95, base=yb-rowH*0.24, half=fs*0.22;
          const t=el("text",{x,y:base,"text-anchor":"middle","font-size":fs,"font-style":"italic","font-weight":600,fill:col,"font-family":"'Times New Roman',Times,serif"},g); t.textContent="p";
          el("polyline",{points:`${x-half+fs*.05},${base-fs*.6} ${x+fs*.05},${base-fs*.78} ${x+half+fs*.05},${base-fs*.6}`,fill:"none",stroke:col,"stroke-width":Math.max(1,size*.08),"stroke-linejoin":"round","stroke-linecap":"round"},g);
        }
      });
    });

    // Normal curve
    if(showTheory){
      let d="";
      for(let i=0;i<=300;i++){
        const v=ax.lo+(ax.hi-ax.lo)*i/300;
        const y=AXIS_Y-3-samples.length*dens(v)*colVal*rowH;
        d+=(i?"L":"M")+sx(v).toFixed(1)+","+Math.max(MT,y).toFixed(1);
      }
      el("path",{d,fill:"none",stroke:curveC,"stroke-width":3},svg);
      const mx=sx(T.mu);
      el("line",{x1:mx,x2:mx,y1:MT,y2:AXIS_Y,stroke:curveC,"stroke-width":1.5,"stroke-dasharray":"6 5"},svg);
      const t=el("text",{x:mx+8,y:MT+14,"font-size":16,"font-weight":700,fill:curveC,"font-family":font},svg);
      t.textContent=stat==="X"?`μ = np = ${fmtNum(T.mu,3)}`:`μ = p = ${fmtNum(T.mu,4)}`;
    }
    svg.setAttribute("aria-label",`Dotplot of ${samples.length} simulated ${stat==="X"?"counts":"proportions"} of orange candies`);
  }

  // ---------- Text panels ----------
  const XS='<span class="m">X</span>', PH='<span class="m">p̂</span>';
  function renderAll(){
    const P=params||readParams();
    $("popLine").innerHTML=P?`Bag: <b>${P.bag.toLocaleString()}</b> candies, <b>${P.orange.toLocaleString()}</b> orange (${fmtNum(P.orange/P.bag*100,2)}%)`:"";
    drawPlot(P);

    const k=samples.length, last=samples[k-1];
    // recent sample
    if(last&&params){
      const n=params.n, shown=last.colors.slice(0,400);
      $("candies").innerHTML=shown.map(c=>`<span class="candy ${c}" title="${c==="o"?"orange":c==="b"?"brown":"yellow"}"></span>`).join("");
      $("candyNote").textContent=n>400?`Showing the first 400 of ${n} candies.`:""; $("candyNote").classList.toggle("hidden",n<=400);
      $("tally").innerHTML=`<p style="color:var(--muted);font-size:15px">Sample #${k}</p><div class="big">${last.x}</div><p>orange out of ${n}</p><p>${XS} = <b>${last.x}</b></p><p>${PH} = ${last.x}/${n} = <b>${fmtNum(last.x/n,4)}</b></p>`;
    } else { $("candies").innerHTML=""; $("candyNote").classList.add("hidden"); $("tally").innerHTML='<p class="empty">Press <b>Take 1 sample</b> to scoop candies from the bag.</p>'; }

    // stats
    const sym=stat==="X"?XS:PH;
    if(k&&params){
      const vals=samples.map(s=>stat==="X"?s.x:s.x/params.n);
      const mean=vals.reduce((a,b)=>a+b,0)/k, sd=k>1?Math.sqrt(vals.reduce((a,b)=>a+(b-mean)**2,0)/(k-1)):null;
      const d=stat==="X"?3:4;
      $("stats").innerHTML=`<span>Samples: <b>${k}</b></span><span>Mean of ${sym} values: <b>${mean.toFixed(d)}</b></span><span>SD of ${sym} values: <b>${sd==null?"—":sd.toFixed(d)}</b></span>`;
    } else $("stats").innerHTML="";

    // count result
    const pred=countPred();
    if(pred&&k&&params){
      const hits=samples.filter(s=>pred.test(stat==="X"?s.x:s.x/params.n)).length;
      $("countRes").innerHTML=`<b>${hits}</b> of ${k} samples have ${sym} ${pred.dir==="ge"?"≥":"≤"} ${fmtNum(pred.v,4)}, a proportion of <b>${fmtNum(hits/k,4)}</b>.`;
    } else $("countRes").textContent= pred?"Take some samples to count them.":"";

    // theory
    const th=$("theoryOn").checked;
    $("theoryPanel").classList.toggle("hidden",!th); document.querySelector(".cols").classList.toggle("solo",!th);
    if(th&&P){
      const {p,n,bag}=P, q=1-p, np=n*p, nq=n*q;
      const sdX=Math.sqrt(np*q), sdP=Math.sqrt(p*q/n);
      const lc=np>=10&&nq>=10, ten=n<=0.1*bag;
      let html="<dl>";
      if(stat==="X"){
        html+=`<dt>Center</dt><dd><span class="m">μ</span><span class="sub">X</span> = <span class="m">np</span> = ${n}(${p}) = <b>${fmtNum(np,4)}</b></dd>`;
        html+=`<dt>Variability</dt><dd><span class="m">σ</span><span class="sub">X</span> = √(<span class="m">np</span>(1 − <span class="m">p</span>)) = √(${n}·${p}·${fmtNum(q,4)}) = <b>${sdX.toFixed(3)}</b></dd>`;
      } else {
        html+=`<dt>Center</dt><dd><span class="m">μ</span><span class="sub">p̂</span> = <span class="m">p</span> = <b>${p}</b></dd>`;
        html+=`<dt>Variability</dt><dd><span class="m">σ</span><span class="sub">p̂</span> = √(<span class="m">p</span>(1 − <span class="m">p</span>)/<span class="m">n</span>) = √(${p}·${fmtNum(q,4)}/${n}) = <b>${sdP.toFixed(4)}</b></dd>`;
      }
      html+=`<dt>Shape</dt><dd>Large Counts: <span class="m">np</span> = ${fmtNum(np,4)} and <span class="m">n</span>(1 − <span class="m">p</span>) = ${fmtNum(nq,4)}. ${lc?'<span class="ok">Both ≥ 10, so approximately Normal.</span>':'<span class="bad">At least one is under 10, so not approximately Normal.</span>'}</dd>`;
      html+=`<dt>10% condition</dt><dd><span class="m">n</span> = ${n} ${ten?"≤":">"} 10% of ${bag.toLocaleString()} = ${fmtNum(0.1*bag,2)}. ${ten?'<span class="ok">Met, so the SD formula works.</span>':'<span class="bad">Not met; the simulated SD will be smaller than the formula.</span>'}</dd>`;
      if(pred){
        const mu=stat==="X"?np:p, sd=stat==="X"?sdX:sdP;
        if(sd>0){
          const z=(pred.v-mu)/sd, pr=pred.dir==="ge"?1-normCdf(z):normCdf(z);
          html+=`<dt>Normal probability</dt><dd><span class="m">z</span> = (${fmtNum(pred.v,4)} − ${fmtNum(mu,4)}) / ${sd.toFixed(stat==="X"?3:4)} = <b>${z.toFixed(2)}</b><br>P(${stat==="X"?XS:PH} ${pred.dir==="ge"?"≥":"≤"} ${fmtNum(pred.v,4)}) ≈ P(<span class="m">z</span> ${pred.dir==="ge"?"≥":"≤"} ${z.toFixed(2)}) = <b>${pr.toFixed(4)}</b></dd>`;
        }
      }
      html+="</dl>";
      $("theoryBody").innerHTML=html;
    }

    // log
    if(k&&params){
      const start=Math.max(0,k-300); let rows="";
      for(let i=start;i<k;i++){ const s=samples[i]; rows+=`<tr><td>${i+1}</td><td class="v">${s.x}</td><td>${s.x}/${params.n}</td><td class="v">${fmtNum(s.x/params.n,4)}</td></tr>`; }
      $("logBody").innerHTML=`<div class="logwrap" id="logwrap"><table><thead><tr><th>Sample</th><th>Orange (${XS})</th><th>${XS}/<span class="m">n</span></th><th>${PH}</th></tr></thead><tbody>${rows}</tbody></table></div>`+(start>0?'<p class="note">Showing the most recent 300 samples.</p>':"");
      const lw=$("logwrap"); lw.scrollTop=lw.scrollHeight;
    } else $("logBody").innerHTML='<p class="empty">Every sample is listed here in order.</p>';
  }

  if(window.matchMedia){ const mq=window.matchMedia("(prefers-color-scheme: dark)"); (mq.addEventListener?mq.addEventListener("change",renderAll):mq.addListener(renderAll)); }
  renderAll();
})();
</script>
</body>
</html>
